                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lanes:
                description: lanes report each lane's CronWorkflow, including maintenance.
                items:
                  description: LaneStatus is copied from the lane's CronWorkflow status.
                  properties:
                    active:
                      description: active is how many of the lane's workflows are
                        running.
                      format: int32
                      type: integer
                    cronWorkflow:
                      description: cronWorkflow is the CronWorkflow's name.
                      type: string
                    failed:
                      description: failed counts failed workflows.
                      format: int64
                      type: integer
                    lastScheduledTime:
                      description: lastScheduledTime is when the lane last started
                        a workflow.
                      format: date-time
                      type: string
                    name:
                      description: name of the lane, or "maintenance".
                      type: string
                    succeeded:
                      description: succeeded counts successful workflows.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              namespace:
                description: namespace is where the workflows run.
                type: string
              serviceAccount:
                description: |-
                  serviceAccount is the runner's identity, as
                  system:serviceaccount:<namespace>:<name>. Grant it Iceberg
                  namespaces through the DataLake's serviceAccountTokens.grants.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
