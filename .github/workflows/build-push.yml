name: Build and Push Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Image names match the Helm charts' image.repository values, so a
          # chart release always finds the image built from the same tag.
          - image: data-lake-operator
            context: .
          - image: data-analytics-operator
            context: data-analytics-operator
          - image: data-orchestration-operator
            context: data-orchestration-operator
          # Versioned with Superset, not the operators. The analytics operator's
          # DefaultImage pins this tag.
          - image: data-platform-superset
            context: data-analytics-operator/images/superset
            superset-version: 5.0.0
            qemu: true
          # Batch ingestion job run by Argo Workflows (data-orchestration-
          # operator). Tagged like the operators: main, sha-<commit>, and the
          # release versions.
          - image: data-platform-ga4-loader
            context: images/ga4-loader
            qemu: true
    env:
      IMAGE: ${{ github.repository_owner }}/${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      # Required to publish build provenance for the pushed image.
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Go images cross-compile, but the Python images run pip for arm64.
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pull requests from forks cannot access GHCR credentials, and we do not
      # want to publish untrusted code, so those runs build without pushing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # The Superset image carries the Superset version instead of the
          # operator release tags.
          tags: |
            type=ref,event=branch,enable=${{ matrix.superset-version == '' }}
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ matrix.superset-version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.superset-version == '' }}
            type=semver,pattern={{major}},enable=${{ matrix.superset-version == '' }}
            type=raw,value=${{ matrix.superset-version }},enable=${{ matrix.superset-version != '' && github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ matrix.superset-version == '' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.superset-version != '' && format('SUPERSET_BASE=apache/superset:{0}', matrix.superset-version) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
